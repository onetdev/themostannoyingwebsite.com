name: Static checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 26

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true
      - run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true
      - run: pnpm run check-types

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true
      - run: pnpm run build --filter='!@maw/ui-docs'
