name: Playwright Tests
on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      testMatch:
        description: 'Test match pattern with regex support'
        required: false
        default: ''

env:
  NODE_VERSION: 26

jobs:
  web-test:
    name: Playwright Tests for Web
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    env:
      NEXT_PUBLIC_CONTENT_API_URL: ${{ vars.NEXT_PUBLIC_CONTENT_API_URL }}
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/setup@v3
      with:
        runtime: node@${{ env.NODE_VERSION }}
        cache: true
        require-lockfile: true
    - name: Build the project
      run: pnpm run build --filter='!@maw/ui-docs'
    - name: Install Playwright Browsers
      run: pnpm --filter '@maw/web' exec playwright install --with-deps
    - name: Run Playwright tests for Web
      run: |
          TEST_MATCH="${{ github.event.inputs.testMatch }}"
          if [ -n "$TEST_MATCH" ]; then
            pnpm --filter '@maw/web' run test:e2e -- "$TEST_MATCH"
          else
            pnpm --filter '@maw/web' run test:e2e
          fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: apps/web/playwright-report/
        retention-days: 30
