app/web:
  - changed-files:
    - any-glob-to-any-file:
      - apps/web/**
app/ui-docs:
  - changed-files:
    - any-glob-to-any-file:
      - apps/ui-docs/**
ci/cd:
  - changed-files:
    - any-glob-to-any-file:
      - .github/auto-assign.yml
      - .github/CODEOWNERS
      - .github/FUNDING.yml
      - .github/labeler.yml
      - .github/queries/**
      - .github/workflows/**
config:
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.config.{js,cjs,mjs,ts,yml,yaml}"
      - "**/tsconfig.json"
      - .dockerignore
      - .envrc.example
      - .vscode/**
      - apps/web/deployment-meta.mjs
      - biome.json
      - lefthook.yml
      - turbo.json
content:
  - changed-files:
    - any-glob-to-any-file:
      - assets/**
      - apps/web/public/ads/**
      - apps/web/public/assets/**
      - apps/web/public/favicon*
      - apps/web/public/manifest/**
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "**/package.json"
      - mise.toml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - "**/AGENTS.md"
      - "**/README.md"
      - .agents/**
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - adr/**
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - docs/**
      - LICENSE
      - skills-lock.json
i18n:
  - changed-files:
    - any-glob-to-any-file:
      - "**/_i18n/**"
      - "**/*.mdx"
      - apps/web/i18n.config.ts
      - apps/web/scripts/build-locales.ts
      - apps/web/scripts/compare-translations.ts
      - apps/web/src/core/i18n/**
      - apps/web/src/features/**/i18n/**
      - apps/web/src/i18n/**
storybook:
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.stories.ts"
      - "**/*.stories.tsx"
      - apps/ui-docs/.storybook/**
testing:
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.spec.ts"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - apps/web/e2e/**
      - apps/web/jest.config.ts
      - apps/web/playwright.config.ts
      - apps/web/tests/**
      - packages/config-jest/**
ui:
  - changed-files:
    - any-glob-to-any-file:
      - apps/web/src/app/**/_components/**/*.tsx
      - apps/web/src/components/**
      - apps/web/src/features/**/components/**/*.tsx
      - packages/ui-lib/src/**
pkg/config-jest:
  - changed-files:
    - any-glob-to-any-file:
      - packages/config-jest/**
pkg/config-ts:
  - changed-files:
    - any-glob-to-any-file:
      - packages/config-ts/**
pkg/content-sdk:
  - changed-files:
    - any-glob-to-any-file:
      - packages/content-sdk/**
pkg/logger:
  - changed-files:
    - any-glob-to-any-file:
      - packages/logger/**
pkg/ui-lib:
  - changed-files:
    - any-glob-to-any-file:
      - packages/ui-lib/**
pkg/utils:
  - changed-files:
    - any-glob-to-any-file:
      - packages/utils/**
