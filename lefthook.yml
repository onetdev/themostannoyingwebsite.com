pre-commit:
  commands:
    biome-check:
      glob: "*.{js,ts,tsx,jsx,json,css,md}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    build:
      run: pnpm build
    test:
      run: pnpm test
